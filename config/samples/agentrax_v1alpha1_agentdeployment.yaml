apiVersion: agentrax.io/v1alpha1
kind: AgentDeployment
metadata:
  name: query-agent
  namespace: default
spec:
  image: gcr.io/google-containers/echoserver:1.4
  tenantRef: team-search
  replicas:
    min: 1
    max: 3
    metric: queueDepth
    target: 50
  rollout:
    strategy: Recreate
  mcp:
    expose: false
