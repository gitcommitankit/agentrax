# permissions for end users to edit tenantquotas.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agentrax
    app.kubernetes.io/managed-by: kustomize
  name: tenantquota-editor-role
rules:
- apiGroups:
  - agentrax.agentrax.io
  resources:
  - tenantquotas
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agentrax.agentrax.io
  resources:
  - tenantquotas/status
  verbs:
  - get
