# permissions for end users to view tenantquotas.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agentrax
    app.kubernetes.io/managed-by: kustomize
  name: tenantquota-viewer-role
rules:
- apiGroups:
  - agentrax.agentrax.io
  resources:
  - tenantquotas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agentrax.agentrax.io
  resources:
  - tenantquotas/status
  verbs:
  - get
